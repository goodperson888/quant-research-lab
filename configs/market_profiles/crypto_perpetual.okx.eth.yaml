  leverage: 1.0
  live_trading_enabled: false
  automatic_leverage_increase: false
adjustments:
  mark_to_market_price: mark_price
  all_storage_timestamps: UTC
roll_rules: not_applicable
corporate_action_rules: not_applicable
unmodeled_or_pending_constraints:
  - historical_account_specific_leverage_tiers
  - cross_and_portfolio_margin
  - order_book_queue_and_partial_fill_probability
  - mark_index_dislocation
  - exchange_outage
market_specific_risks:
  - funding_and_basis
  - mark_index_dislocation
  - liquidation_and_leverage_tiers
  - exchange_outage
  - venue_specific_margin_rules
