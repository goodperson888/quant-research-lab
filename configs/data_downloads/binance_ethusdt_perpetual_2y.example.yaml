schema_version: 1
download_id: binance_ethusdt_perpetual_2y_plan
enabled: false
plan_only_default: true
market_profile: configs/market_profiles/crypto_perpetual.binance.eth.yaml
source:
  venue: binance
  official_archive: https://data.binance.vision/data/futures/um
  public_api_metadata: https://fapi.binance.com/fapi/v1/exchangeInfo
  credentials_required: false
range:
  start_utc_inclusive: "2024-07-20T00:00:00Z"
  end_utc_exclusive: "2026-07-20T00:00:00Z"
symbol:
  unified: ETH/USDT:USDT
  native: ETHUSDT
timeframes: [5m, 15m, 1h, 4h]
datasets:
  - futures_ohlcv
  - funding_rate
  - mark_price
  - index_price
  - open_interest_metrics
data_version: binance-vision-ethusdt-perpetual-2y-planned-v1
manifest_artifact_key: data/manifests/binance_ethusdt_perpetual_2y_planned_v1.json
quality_report_artifact_key: reports/data_quality/binance_ethusdt_perpetual_2y_planned_v1.md
storage:
  raw_write_mode: append_only
  raw_immutable: true
  processed_versioned: true
  atomic_writes: true
  parquet_compression: zstd
  automatic_deletion: false
  overwrite_existing_one_year_data: false
approval:
  public_network_download_authorized_by_user: false
  exact_window_confirmation_required: true
required_outputs:
  - immutable_raw_data
  - parquet_dataset
  - independent_data_manifest
  - quality_report
limitations:
  - "This file is a plan template, not network-download authorization."
  - "The existing one-year manifest and raw files must not be overwritten."
  - "Unavailable funding, mark, index or OI intervals remain explicit and never become zero."
  - "Two years improve market-state coverage but do not prove profitability."
