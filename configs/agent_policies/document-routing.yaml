version: 5
policy_id: quant_lab_document_routing_v5
default_agent_run_mode: guided
instruction_precedence:
  - system_developer_runtime_permissions
  - explicit_user_scope
  - closest_agents_md
  - routed_project_documents
  - applicable_skill
  - general_agent_defaults
enforcement:
  prompt_only_controls_forbidden: true
  required_code_controls:
    - baseline_immutability
    - explicit_approval_gates
    - domain_tool_and_job_allowlists
    - project_relative_artifact_keys
    - append_only_audit_events
    - locked_test_isolation
    - no_live_trade_endpoint
    - configured_pipeline_profiles
    - standalone_viability_gate
    - full_stress_requires_viability
    - ex_ante_regime_labels
    - exact_approval_subject_id
    - explicit_regime_mode
    - formal_regime_requires_viability
    - session_research_budget
    - worker_resource_budget
    - proposal_candidate_immutability
    - batch_trial_resume_without_overwrite
    - component_logic_signature_deduplication
    - git_independent_research_lifecycle
    - structured_stop_and_handoff
    - scoped_research_authorization
    - viability_failure_diagnostics_only
    - observed_validation_contamination
    - registered_strategy_execution

intents:
  - intent: strategy_intake
    required_docs:
      - docs/07-个人量化策略研究工作法.md
      - docs/10-市场适配与因子适用性.md
      - docs/15-产品需求规格-v1.md
      - docs/18-Agent与Skill执行架构.md
    required_preconditions:
      - original_source_and_date_available
      - market_profile_selected_or_explicitly_pending
      - ambiguities_recorded
    allowed_tools:
      - intake_strategy
      - formalize_strategy
      - list_ambiguities
      - propose_strategy_version
    required_outputs:
      - research_session
      - immutable_original_source
      - strategy_draft
      - ambiguity_list
      - audit_events
      - research_handoff
    approval_gate:
      action: freeze_baseline
      required: explicit_user_confirmation

  - intent: data_download
    required_docs:
      - docs/01-数据规范.md
      - docs/09-数据存储架构.md
      - docs/10-市场适配与因子适用性.md
      - docs/14-ETH永续第一阶段数据记录.md
      - docs/18-Agent与Skill执行架构.md
      - docs/21-存储治理与保留策略.md
      - docs/22-ETH永续一年数据扩展记录.md
    required_preconditions:
      - explicit_market_profile
      - utc_inclusive_start_and_exclusive_end
      - public_data_or_separately_authorized_credentials
      - immutable_raw_destination
    allowed_tools:
      - download_market_data
      - validate_market_data
      - build_data_manifest
      - build_catalog_views
    required_outputs:
      - immutable_raw_data
      - parquet_dataset
      - data_manifest
      - quality_report
      - audit_events
      - research_handoff
    approval_gate:
      action: network_download
      required: runtime_permission_when_requested

  - intent: baseline_backtest
    required_docs:
      - docs/00-标准研究流程.md
      - docs/02-回测与验收规范.md
      - docs/07-个人量化策略研究工作法.md
      - docs/10-市场适配与因子适用性.md
      - docs/15-产品需求规格-v1.md
      - docs/18-Agent与Skill执行架构.md
      - docs/20-Freqtrade能力边界与融合方案.md
    required_preconditions:
      - baseline_frozen
      - market_profile_matches_validation_scope
      - data_manifest_selected
      - cost_model_complete
      - funding_not_silently_zero_for_perpetuals
      - time_splits_recorded
    allowed_tools:
      - create_job
      - run_backtest
      - run_correctness_diagnostic
      - get_job
      - generate_report
    required_outputs:
      - experiment_run_manifest
      - job_logs
      - trades_or_failure_reason
      - baseline_report
      - correctness_diagnostic_artifact_or_explicit_unsupported
      - audit_events
      - research_handoff
    approval_gate:
      action: freeze_or_change_baseline
      required: explicit_user_confirmation

  - intent: parameter_optimization
    required_docs:
      - docs/02-回测与验收规范.md
      - docs/04-压力测试清单.md
      - docs/07-个人量化策略研究工作法.md
      - docs/15-产品需求规格-v1.md
      - docs/16-产品化目标架构-v1.md
      - docs/18-Agent与Skill执行架构.md
      - docs/25-批量策略研究闭环.md
      - docs/26-流畅研究授权与失败诊断.md
    required_preconditions:
      - baseline_frozen
      - single_falsifiable_hypothesis
      - parameter_space_defined
      - objective_and_constraints_defined
      - train_validation_locked_test_defined
      - cost_model_complete
      - max_trials_or_time_budget_defined
      - stopping_conditions_defined
      - exact_baseline_and_proposal_subject_ids
      - approved_proposal_and_immutable_candidate_for_research_batch
      - locked_test_explicitly_excluded_from_search
    allowed_tools:
      - create_experiment_plan
      - approve_experiment_plan
      - create_improvement_direction
      - approve_proposal
      - run_parameter_search
      - get_job
      - compare_runs
      - propose_strategy_version
      - accept_proposal
      - create_component_candidate
      - list_component_evidence
    required_outputs:
      - approved_experiment_plan
      - immutable_candidate_snapshot
      - trial_records
      - batched_parquet_trial_metrics
      - parameter_stability_analysis
      - out_of_sample_comparison
      - proposal_or_rejection
      - audit_events
      - research_handoff
    approval_gate:
      action: run_parameter_search
      required: explicit_user_approval_of_experiment_plan

  - intent: stress_test
    required_docs:
      - docs/02-回测与验收规范.md
      - docs/04-压力测试清单.md
      - docs/07-个人量化策略研究工作法.md
      - docs/18-Agent与Skill执行架构.md
      - docs/25-批量策略研究闭环.md
      - docs/20-Freqtrade能力边界与融合方案.md
    required_preconditions:
      - candidate_or_baseline_version_selected
      - pipeline_profile_selected
      - stress_level_declared_as_cheap_or_full
      - stress_scenarios_declared
      - cost_and_execution_assumptions_declared
      - immutable_run_manifest_destination
      - fast_screen_passed_when_stress_level_is_cheap
      - viability_passed_when_stress_level_is_full
    allowed_tools:
      - create_job
      - run_backtest
      - compare_runs
      - generate_report
      - reject_candidate
    required_outputs:
      - stress_run_manifests
      - sensitivity_results
      - failure_conditions
      - report
      - audit_events
      - research_handoff
    approval_gate:
      action: change_strategy_status
      required: explicit_user_confirmation

  - intent: pipeline_evaluation
    required_docs:
      - docs/00-标准研究流程.md
      - docs/02-回测与验收规范.md
      - docs/04-压力测试清单.md
      - docs/07-个人量化策略研究工作法.md
      - docs/15-产品需求规格-v1.md
      - docs/16-产品化目标架构-v1.md
      - docs/18-Agent与Skill执行架构.md
      - docs/25-批量策略研究闭环.md
      - docs/26-流畅研究授权与失败诊断.md
    required_preconditions:
      - pipeline_profile_selected
      - exact_subject_id_selected
      - market_profile_selected
      - gate_inputs_and_evidence_declared
      - no_locked_test_use_before_viability
      - regime_mode_declared
      - passed_same_subject_viability_when_mode_is_regime_validation
      - research_session_budget_available
      - exact_proposal_subject_when_batch_research_is_requested
      - exact_subject_research_authorization_when_auto_continue_is_requested
      - reviewed_strategy_executor_registered_before_execution
    allowed_tools:
      - list_pipeline_profiles
      - evaluate_gate
      - create_strategy_outcome
      - create_component_candidate
      - record_regime_validation
      - run_correctness_diagnostic
      - generate_report
      - create_research_authorization
      - run_authorized_pipeline
      - generate_failure_diagnostics
      - list_component_hypotheses
    required_outputs:
      - gate_evaluation
      - stop_or_continue_decision
      - strategy_outcome_or_component_branch
      - audit_events
      - budget_usage_or_blocked_evidence
      - research_handoff
      - research_authorization_stage_events
      - run_bundle
    approval_gate:
      action: locked_test_full_stress_or_state_change
      required: explicit_subject_id_and_user_confirmation

  - intent: dry_run
    required_docs:
      - docs/02-回测与验收规范.md
      - docs/05-自动化运行规范.md
      - docs/06-安全与实盘门禁.md
      - docs/07-个人量化策略研究工作法.md
      - docs/15-产品需求规格-v1.md
      - docs/18-Agent与Skill执行架构.md
    required_preconditions:
      - validated_strategy_version
      - dry_run_only_configuration
      - live_trading_disabled
      - leverage_and_capital_limits_recorded
      - monitoring_and_stop_conditions_defined
    allowed_tools:
      - create_job
      - get_job
      - generate_report
      - prepare_dry_run
    required_outputs:
      - dry_run_configuration_summary
      - monitoring_log
      - incident_and_stop_record
      - audit_events
      - research_handoff
    approval_gate:
      action: start_external_exchange_dry_run
      required: explicit_user_confirmation

forbidden_tools:
  - arbitrary_shell
  - arbitrary_absolute_path
  - live_trade
  - credential_read_or_write
  - automatic_production_promotion
