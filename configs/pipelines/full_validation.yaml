schema_version: 1
profile_id: full_validation
label: Full Validation
description: Full evidence path after correctness and viability have passed.
candidate_eligible: true
stages:
  - id: correctness
    gate: correctness
    approval: none
    stop_on_fail: true
    outputs: [code_checks, representative_trade_audit]
  - id: fast_screen
    gate: fast_screen
    approval: none
    stop_on_fail: true
    outputs: [train_validation_metrics, manifest]
  - id: viability
    gate: viability
    approval: none
    stop_on_fail: true
    outputs: [viability_result, failure_reasons]
  - id: cheap_cost_sensitivity
    gate: incremental
    approval: none
    stop_on_fail: true
    outputs: [cost_sensitivity]
  - id: regime_and_pine
    gate: robustness
    approval: explicit_subject_id
    stop_on_fail: true
    outputs: [regime_validation, pine_reconciliation]
  - id: full_validation_and_locked_test
    gate: locked_test
    approval: explicit_subject_id
    stop_on_fail: true
    outputs: [walk_forward, locked_test_result]
  - id: full_stress
    gate: robustness
    approval: explicit_subject_id
    stop_on_fail: true
    outputs: [full_stress_report]
  - id: dry_run
    gate: dry_run
    approval: explicit_subject_id
    stop_on_fail: true
    outputs: [dry_run_plan]
gates:
  correctness:
    requires: []
  fast_screen:
    requires: [correctness]
  incremental:
    requires: [fast_screen]
  viability:
    requires: [fast_screen]
  robustness:
    requires: [viability]
  locked_test:
    requires: [viability, robustness]
  dry_run:
    requires: [viability, robustness, locked_test]
acceptance_policies:
  crypto_perpetual:
    standalone:
      min_validation_net_return: 0.0
      min_validation_profit_factor: 1.10
      min_validation_expectancy: 0.0
      min_validation_trades: 50
      max_validation_drawdown_abs: 0.18
    diagnostic_component:
      min_incremental_net_return_delta: 0.02
      min_validation_trades: 30
pine_validation:
  natural_language_or_python:
    full_reconciliation_after: viability
  pine_source:
    early_checks: [semantic, repainting, multi_timeframe, golden_trades]
    full_diagnostic_after: viability
