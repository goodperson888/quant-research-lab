baseline_version_id: version_1978576d128f420da09793a59bd37f89
subject_id: version_1978576d128f420da09793a59bd37f89
hypothesis: >-
  在保持入场、仓位、止损、止盈、时间止损和成本模型不变时，仅改变
  ema21_structure_exit 的确认速度，可能减少过早结构退出造成的亏损；
  若改善只出现在单一变体或 train/validation 方向不一致，则否定该假设。
rule_diff:
  component_type: exit
  component_hypothesis_id: component_hypothesis_f0164aa6a5e44b148a616562652fc401
  fixed_rules:
    - All entry, sizing, protective-stop, take-profit and time-stop rules remain unchanged.
    - Exit decisions use closed 5m bars only and execute at the next 5m bar open.
    - Intrabar liquidation, protective stop and take profit keep their existing conservative priority.
  variants:
    current:
      long: >-
        After one closed 5m bar closes below 5m EMA21, exit at the next 5m bar open.
      short: >-
        After one closed 5m bar closes above 5m EMA21, exit at the next 5m bar open.
    tighter:
      long: >-
        After one closed 5m bar closes below 5m EMA9, exit at the next 5m bar open.
      short: >-
        After one closed 5m bar closes above 5m EMA9, exit at the next 5m bar open.
    looser:
      long: >-
        After two consecutive closed 5m bars close below 5m EMA21, exit at the
        open following the second closed bar.
      short: >-
        After two consecutive closed 5m bars close above 5m EMA21, exit at the
        open following the second closed bar.
  interpretation:
    tighter: Earlier adverse-momentum exit using EMA9.
    looser: Later confirmation requiring two adverse EMA21 closes.
  forbidden_changes:
    - No entry-rule changes.
    - No protective-stop, take-profit, time-stop or position-size changes.
    - No leverage, fee, slippage or funding-assumption changes.
    - No locked-test access.
